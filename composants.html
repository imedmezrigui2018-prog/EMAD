<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composants du Board</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0d1b2a;
            color: #edf2f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .badge-critique {
            background-color: #e63946;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
        }
        .kpi-container {
            display: flex;
            gap: 1.5rem;
            margin-top: 8px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .form-section, .list-section, .chart-section {
            background-color: #1c2738;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #edf2f4;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: #0d1b2a;
            color: #fff;
            border: 1px solid #457b9d;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-custom {
            border: none;
            border-radius: 5px;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }
        .btn-custom:hover {
            opacity: 0.9;
        }
        .badge-mois:hover {
            opacity: 0.85;
        }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('✅ Service Worker PWA enregistré !'))
          .catch(err => console.error('❌ Erreur Service Worker:', err));
      }
    </script>
</head>
<body>

    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #1c2738;">
        <div class="logo" id="page-title" style="color: white; font-weight: bold; font-size: 1.1rem;">Composants du Board : Chargement...</div>
        <a href="#" id="btn-retour" style="color: #00b4d8; text-decoration: none; font-weight: bold; border: 1px solid #00b4d8; padding: 8px 15px; border-radius: 5px; transition: 0.3s;">
            Retour au Board
        </a>
    </nav>

    <main class="main-content" style="padding: 20px; max-width: 900px; margin: 0 auto;">
        
        <div class="form-section" style="border-left: 4px solid #fca311;">
            <h3 style="color: #fca311; margin-top: 0;">Signaler une intervention / défaillance</h3>
            <form id="defaillance-form">
                <div style="margin-bottom: 15px;">
                    <label>1. Sélectionner le composant :</label>
                    <select id="composant-select" required>
                        <option value="">-- Choisir un composant --</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>2. Type d'intervention réalisée :</label>
                    <div style="margin-top: 8px; display: flex; gap: 20px; color: #edf2f4;">
                        <label style="cursor: pointer;"><input type="radio" name="type_intervention" value="modification" required> Modification (Réparation)</label>
                        <label style="cursor: pointer;"><input type="radio" name="type_intervention" value="remplacement"> Remplacement (Neuf)</label>
                    </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>3. Temps d'arrêt machine estimé (en minutes) :</label>
                    <input type="number" id="temps-darret" required min="0" placeholder="Ex: 30">
                </div>

                <button type="submit" class="btn-custom" style="width: 100%; background-color: #e63946; font-size: 1rem;">Valider la défaillance</button>
            </form>
            <div id="form-message" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
        </div>

        <div class="list-section">
            <h2 style="color: white; margin-top: 0; margin-bottom: 15px;">Liste des Composants</h2>
            <div id="components-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
            <div id="error-message" style="color: #e63946; display: none; text-align: center; margin-top: 10px;"></div>
        </div>

        <div class="form-section" style="border-left: 4px solid #2a9d8f;">
            <h3 style="color: #2a9d8f; margin-top: 0;">Ajouter un composant à ce Board</h3>
            <form id="add-composant-form">
                <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
                    <div style="flex: 1; min-width: 150px;">
                        <label>ID du composant</label>
                        <input type="text" id="new-comp-id" placeholder="Ex: COMP-01" required>
                    </div>
                    <div style="flex: 2; min-width: 200px;">
                        <label>Nom du composant</label>
                        <input type="text" id="new-comp-nom" placeholder="Ex: Moteur Principal" required>
                    </div>
                </div>
                <button type="submit" class="btn-custom" style="width: 100%; background-color: #2a9d8f; font-size: 1rem;">Ajouter le composant</button>
            </form>
            <div id="add-composant-message" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
        </div>

        <div class="chart-section">
            <h3 style="color: #00b4d8; text-align: center; margin-top: 0; margin-bottom: 15px;">Analyse des Défaillances (Modifications vs Remplacements)</h3>
            <canvas id="defaillanceChart"></canvas>
        </div>

    </main>

    <script>
        const nomOuvrier = localStorage.getItem('nomOuvrier');
        if (!nomOuvrier) window.location.href = 'login.html';
        const matriculeOuvrier = localStorage.getItem('matriculeOuvrier');
        const roleComposant = localStorage.getItem('roleComposant');
        const estAdminUI = roleComposant === 'admin';
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('board_id');

        if (!boardId) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('page-title').textContent = `Composants du Board : ${boardId.toUpperCase()}`;
        if (!estAdminUI) {
            document.getElementById('add-composant-form').closest('.form-section').style.display = 'none';
        }
        document.getElementById('btn-retour').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = `board-details.html?board_id=${boardId}`; 
        });

        let defaillanceChartInstance = null;

        async function supprimerComposant(compId, compNom) {
            if (!confirm(`Voulez-vous vraiment supprimer le composant "${compNom}" (${compId}) ?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/composants/${compId}?matricule=${encodeURIComponent(matriculeOuvrier)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.success) {
                    loadComponents();
                } else {
                    alert("❌ Erreur : " + result.message);
                }
            } catch (error) {
                alert("❌ Erreur de connexion au serveur.");
            }
        }

        async function loadComponents() {
            try {
                const response = await fetch(`/api/composants/${boardId}`);
                const data = await response.json();

                if (data.success) {
                    const listDiv = document.getElementById('components-list');
                    const selectMenu = document.getElementById('composant-select');
                    listDiv.innerHTML = '';
                    selectMenu.innerHTML = '<option value="">-- Choisir un composant --</option>';

                    const labels = [];
                    const modifData = [];
                    const replaceData = [];

                    if (data.composants.length === 0) {
                        listDiv.innerHTML = '<p style="text-align:center; color:#8d99ae;">Aucun composant trouvé pour ce board.</p>';
                        renderChart([], [], []);
                        return;
                    }

                    data.composants.forEach(comp => {
                        const defautsTotal = comp.defaut_count || 0;
                        const downtime = comp.temps_darret || 0;

                        const mttr = defautsTotal > 0 ? (downtime / defautsTotal).toFixed(1) : 0;
                        const heuresFonctionnementTotal = 720; 
                        const mtbf = defautsTotal > 0 ? ((heuresFonctionnementTotal - (downtime / 60)) / defautsTotal).toFixed(0) : heuresFonctionnementTotal;

                        const now = new Date();
                        const currentMonthInt = parseInt(`${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}`, 10);
                        
                        const defautsMoisActuel = (Number(comp.dernier_mois_enregistre) === currentMonthInt) 
                            ? (comp.defauts_mois_actuel || 0) 
                            : 0;

                        const isCritique = defautsMoisActuel >= 5;
                        const badgeHTML = isCritique ? `<span class="badge-critique">⚠️ Composant Critique</span>` : '';

                        const item = document.createElement('div');
                        item.style.backgroundColor = '#0d1b2a';
                        item.style.padding = '15px';
                        item.style.borderRadius = '6px';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.alignItems = 'center';
                        item.style.border = '1px solid #334155';
                        item.style.flexWrap = 'wrap';
                        item.style.gap = '10px';

                        item.innerHTML = `
                            <div class="comp-info" style="flex: 1; min-width: 250px;">
                                <div class="comp-header" style="font-size: 1.1rem; color: white;">
                                    ${comp.nom} <strong style="color: #00b4d8;">(${comp.id})</strong>
                                    ${badgeHTML}
                                </div>
                                <div style="color: #8d99ae; font-size: 0.8rem; margin-top: 4px;">
                                    Ajouté par : <strong>${comp.ajoute_par || 'Inconnu'}</strong>
                                </div>
                                <div class="kpi-container">
                                    <div style="color: #00b4d8;">
                                        <strong>MTBF :</strong> ${mtbf} hrs
                                        <span style="color: #8d99ae; font-size: 0.75rem;">(Intervallle pannes)</span>
                                    </div>
                                    <div style="color: #fca311;">
                                        <strong>MTTR :</strong> ${mttr} min
                                        <span style="color: #8d99ae; font-size: 0.75rem;">(Temps réparation)</span>
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="badge-mois" style="background-color: #334155; padding: 6px 12px; border-radius: 20px; color: white; font-weight: bold; font-size: 0.85rem; cursor: pointer;" title="Cliquer pour voir le détail par matricule">
                                    ${defautsMoisActuel} défaillance(s) ce mois
                                </span>
                                ${estAdminUI ? `<button class="btn-delete-composant btn-custom" style="background-color: #e63946; padding: 6px 12px;">✕</button>` : ''}
                            </div>
                        `;
                        listDiv.appendChild(item);

                        item.querySelector('.badge-mois').addEventListener('click', () => {
                            afficherRepartitionDefaillances(comp.id, comp.nom);
                        });

                        const btnDelete = item.querySelector('.btn-delete-composant');
                        if (btnDelete) {
                            btnDelete.addEventListener('click', () => {
                                supprimerComposant(comp.id, comp.nom);
                            });
                        }

                        const option = document.createElement('option');
                        option.value = comp.id;
                        option.textContent = `${comp.nom} (${comp.id})`;
                        selectMenu.appendChild(option);

                        labels.push(comp.nom);
                        modifData.push(comp.modification_count || 0);
                        replaceData.push(comp.replacement_count || 0);
                    });

                    renderChart(labels, modifData, replaceData);

                } else {
                    document.getElementById('error-message').textContent = data.message;
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (error) {
                console.error("Erreur :", error);
                document.getElementById('error-message').textContent = "Erreur de connexion au serveur.";
                document.getElementById('error-message').style.display = 'block';
            }
        }

        async function afficherRepartitionDefaillances(compId, compNom) {
            try {
                const response = await fetch(`/api/composants/${compId}/defaillances-mois`);
                const data = await response.json();

                if (data.success && data.repartition.length > 0) {
                    const texte = data.repartition
                        .map(r => `${r.count} défaillance${r.count > 1 ? 's' : ''} déclarée${r.count > 1 ? 's' : ''} par ${r.ajoute_par}`)
                        .join('\n');
                    alert(`Défaillances ce mois — ${compNom} :\n\n${texte}`);
                } else {
                    alert(`Aucune défaillance déclarée ce mois-ci pour ${compNom}.`);
                }
            } catch (error) {
                alert("Erreur lors de la récupération du détail des défaillances.");
            }
        }

        function renderChart(labels, modifData, replaceData) {
            const ctx = document.getElementById('defaillanceChart').getContext('2d');
            if (defaillanceChartInstance) defaillanceChartInstance.destroy();

            defaillanceChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Modifications', data: modifData, backgroundColor: '#00b4d8' },
                        { label: 'Remplacements', data: replaceData, backgroundColor: '#e63946' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8d99ae' }, grid: { color: '#334155' } },
                        x: { ticks: { color: '#8d99ae' }, grid: { display: false } }
                    },
                    plugins: { legend: { labels: { color: '#ffffff' } } }
                }
            });
        }

        document.getElementById('add-composant-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const msgDiv = document.getElementById('add-composant-message');
            msgDiv.textContent = "Ajout en cours...";
            msgDiv.style.color = "#fca311";

            const payload = {
                id: document.getElementById('new-comp-id').value.trim(),
                bretbau_id: boardId,
                nom: document.getElementById('new-comp-nom').value.trim(),
                ajoute_par: matriculeOuvrier
            };

            try {
                const response = await fetch('/api/composants', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    msgDiv.textContent = "✅ " + result.message;
                    msgDiv.style.color = "#2a9d8f";
                    document.getElementById('add-composant-form').reset();
                    loadComponents();
                    setTimeout(() => { msgDiv.textContent = ""; }, 4000);
                } else {
                    msgDiv.textContent = "❌ Erreur : " + result.message;
                    msgDiv.style.color = "#e63946";
                }
            } catch (error) {
                msgDiv.textContent = "❌ Erreur de connexion.";
                msgDiv.style.color = "#e63946";
            }
        });

        document.getElementById('defaillance-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const msgDiv = document.getElementById('form-message');
            msgDiv.textContent = "Enregistrement en cours...";
            msgDiv.style.color = "#fca311";

            const payload = {
                composant_id: document.getElementById('composant-select').value,
                type_intervention: document.querySelector('input[name="type_intervention"]:checked').value,
                temps_darret_ajout: document.getElementById('temps-darret').value,
                ajoute_par: matriculeOuvrier
            };

            try {
                const response = await fetch('/api/composants/defaillance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    msgDiv.textContent = "✅ " + result.message + (result.logError ? " ⚠️ " + result.logError : "");
                    msgDiv.style.color = result.logError ? "#fca311" : "#2a9d8f";
                    document.getElementById('defaillance-form').reset();
                    loadComponents(); 
                    setTimeout(() => { msgDiv.textContent = ""; }, 6000);
                } else {
                    msgDiv.textContent = "❌ Erreur : " + result.message;
                    msgDiv.style.color = "#e63946";
                }
            } catch (error) {
                msgDiv.textContent = "❌ Erreur de connexion.";
                msgDiv.style.color = "#e63946";
            }
        });

        loadComponents();
        
    </script>
</body>
</html>
