<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brett Bau - Changements</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    <style>
        .history-container {
            margin-top: 2rem;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .change-card {
            background-color: #0d1b2a;
            border-left: 4px solid #00b4d8;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .change-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #1c2738;
            padding-bottom: 0.5rem;
        }
        .change-title { color: #00b4d8; font-size: 1.2rem; font-weight: bold; }
        .change-date { color: #8d99ae; font-size: 0.9rem; }
        .change-rapport { color: #edf2f4; margin-top: 0.5rem; line-height: 1.4; word-break: break-word; }
        .change-auteur {
            margin-top: 10px; font-size: 0.85rem; color: #a8b2c1;
            font-style: italic; border-top: 1px dashed #1c2738; padding-top: 5px;
        }
        .add-change-form {
            background-color: #1c2738; padding: 1.5rem;
            border-radius: 8px; margin-top: 2rem;
            width: 100%; max-width: 700px;
        }
        .add-change-form h3 { margin-top: 0; color: #fca311; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        textarea {
            width: 100%; height: 80px; padding: 0.8rem; border-radius: 5px;
            border: 1px solid #457b9d; background-color: #0d1b2a; color: #fff; margin-bottom: 1rem;
            box-sizing: border-box;
        }
        select, input[type="text"], input[type="date"] {
            width: 100%; padding: 0.8rem; border-radius: 5px;
            border: 1px solid #457b9d; background-color: #0d1b2a; color: #fff; box-sizing: border-box;
        }
        input[type="file"] { width: 100%; padding: 0.6rem 0; color: #edf2f4; }
        .btn-action {
            background-color: #00b4d8; color: #fff; padding: 10px 15px;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn-action:hover { background-color: #0096c7; }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('✅ Service Worker PWA enregistré !'))
          .catch(err => console.error('❌ Erreur Service Worker:', err));
      }
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Historique des Changements : <span id="display-board-id"></span></div>
        <button onclick="window.history.back()" class="logout-btn" style="color: #00b4d8; background: none; border: none; cursor: pointer; font-size: 1rem;">Retour au Board</button>
    </nav>

    <main class="main-content">
        
        <div class="history-container" id="history-list">
            <p style="color: #8d99ae;">Chargement de l'historique...</p>
        </div>

        <div class="add-change-form">
            <h3>Ajouter une intervention</h3>
            <form id="new-change-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nom du Changement </label>
                        <input type="text" id="c-id" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="c-date" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Physique ou non physique</label>
                        <select id="c-titre" required>
                            <option value="">-- Choisir --</option>
                            <option value="Physique">Physique</option>
                            <option value="Non physique">Non physique</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Rapport détaillé (texte)</label>
                    <textarea id="c-rapport" placeholder="Décrivez l'intervention (optionnel si vous importez un fichier)..."></textarea>
                </div>
                <div class="form-group">
                    <label>Ou importer un fichier (PDF ou Image)</label>
                    <input type="file" id="c-rapport-fichier" accept=".pdf, .jpg, .jpeg, .png">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; margin-top: 1rem;">Enregistrer le changement</button>
            </form>
            <p id="form-msg" style="margin-top: 1rem; font-weight: bold;"></p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nomOuvrier = localStorage.getItem('nomOuvrier');
            const matriculeOuvrier = localStorage.getItem('matriculeOuvrier');
            
            const roleChangement = localStorage.getItem('roleChangement');
            const estAdminUI = roleChangement === 'admin';
            
            if (!nomOuvrier) {
                window.location.href = 'login.html';
                return;
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const boardId = urlParams.get('board_id');

            if (!boardId) {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('display-board-id').textContent = boardId.toUpperCase();

            if (!estAdminUI) {
                document.querySelector('.add-change-form').style.display = 'none';
            }

            async function fetchChangements() {
                const historyList = document.getElementById('history-list');
                
                try {
                    const response = await fetch(`/api/changements/${boardId}`);
                    
                    if (!response.ok) {
                        throw new Error(`Erreur réseau (${response.status})`);
                    }
                    
                    const data = await response.json();
                    historyList.innerHTML = '';

                    let changementsList = [];
                    if (data.changements && Array.isArray(data.changements)) {
                        changementsList = data.changements;
                    } else if (Array.isArray(data)) {
                        changementsList = data;
                    }

                    if (changementsList.length > 0) {
                        changementsList.forEach(chg => {
                            const dateFormatee = chg.date_changement ? new Date(chg.date_changement).toLocaleDateString('fr-FR') : 'Date inconnue';
                            
                            const estFichier = typeof chg.rapport === 'string' && (chg.rapport.startsWith('http') || chg.rapport.startsWith('/'));
                            const rapportHTML = estFichier
                                ? `<a href="${chg.rapport}" target="_blank" style="color:#00b4d8; text-decoration: underline;">Voir le fichier joint</a>`
                                : (chg.rapport || 'Aucun détail');

                            const card = document.createElement('div');
                            card.className = 'change-card';
                            
                            card.innerHTML = `
                                <div class="change-header">
                                    <span class="change-title">${chg.id || 'Sans ID'} <span style="font-size:0.8rem; color:#8d99ae;">- ${chg.titre || ''}</span></span>
                                    <span class="change-date">${dateFormatee}</span>
                                </div>
                                <div class="change-rapport">
                                    <strong>Rapport :</strong> <br> ${rapportHTML}
                                </div>
                                <div class="change-auteur">
                                    Ajouté par : <strong>${chg.ajoute_par || 'Inconnu'}</strong>
                                </div>
                            `;
                            historyList.appendChild(card);
                        });
                    } else {
                        historyList.innerHTML = '<p style="color: #8d99ae;">Aucun historique de changement pour ce Board.</p>';
                    }
                } catch (error) {
                    console.error("Erreur de chargement :", error);
                    historyList.innerHTML = `<p style="color: #e63946;">Erreur de chargement : ${error.message}</p>`;
                }
            }

            document.getElementById('new-change-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const msgBox = document.getElementById('form-msg');
                msgBox.textContent = "Enregistrement en cours...";
                msgBox.style.color = "#fca311";

                const fichierInput = document.getElementById('c-rapport-fichier');
                let rapportFinal = document.getElementById('c-rapport').value.trim();

                try {
                    if (fichierInput.files.length > 0) {
                        const formData = new FormData();
                        formData.append('fichier', fichierInput.files[0]);

                        const uploadResponse = await fetch('/api/changements/upload', {
                            method: 'POST',
                            body: formData
                        });
                        
                        const uploadResult = await uploadResponse.json();

                        if (!uploadResponse.ok || !uploadResult.success) {
                            throw new Error(uploadResult.message || "Échec de l'upload du fichier.");
                        }
                        rapportFinal = uploadResult.url;
                    }

                    if (!rapportFinal) {
                        msgBox.textContent = "❌ Veuillez écrire un rapport texte ou choisir un fichier.";
                        msgBox.style.color = "#e63946";
                        return;
                    }

                    const nouveauChangement = {
                        id: document.getElementById('c-id').value,
                        bretbau_id: boardId,
                        date_changement: document.getElementById('c-date').value,
                        titre: document.getElementById('c-titre').value,
                        rapport: rapportFinal,
                        ajoute_par: matriculeOuvrier
                    };

                    const response = await fetch('/api/changements', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(nouveauChangement)
                    });
                    
                    const result = await response.json();

                    if (response.ok && result.success) {
                        msgBox.textContent = "✅ Changement enregistré avec succès !";
                        msgBox.style.color = "#2a9d8f";
                        document.getElementById('new-change-form').reset();
                        fetchChangements();
                    } else {
                        msgBox.textContent = "❌ Erreur : " + (result.message || "Impossible d'enregistrer.");
                        msgBox.style.color = "#e63946";
                    }
                } catch (error) {
                    console.error("Erreur enregistrement :", error);
                    msgBox.textContent = "❌ Erreur : " + error.message;
                    msgBox.style.color = "#e63946";
                }
            });

            fetchChangements();
        });
    </script>
</body>
</html>
