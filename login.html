<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brett Bau - Connexion</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('✅ Service Worker PWA enregistré !'))
            .catch(err => console.error('❌ Erreur Service Worker:', err));
        });
      }
    </script>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-header">
            <h1>Brett Bau</h1>
            <p>Portail de Maintenance des Boards</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Identifiant / Matricule</label>
                <input type="text" id="username" name="username" placeholder="Ex: 4589" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <p id="error-message" style="color: #e63946; margin-top: 1rem; font-size: 0.9rem; display: none;"></p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const matricule = document.getElementById('username').value;
            const mot_de_passe = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ matricule, mot_de_passe })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('nomOuvrier', data.user.nom);
                    localStorage.setItem('matriculeOuvrier', matricule);
                    localStorage.setItem('roleComposant', data.user.role_composant || 'ouvrier');
                    localStorage.setItem('roleChangement', data.user.role_changement || 'ouvrier');
                    window.location.href = 'dashboard.html';
                } else {
                    errorMessage.textContent = data.message;
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = "Serveur éteint. Avez-vous lancé node server.js ?";
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
